; PlatformIO — KineticPulse wristband (Seeed XIAO ESP32-S3)
;
;   cp src/wifi_secrets.h.example src/wifi_secrets.h
;   pio run -e seeed_xiao_esp32s3 -t upload
;   pio run -e i2c_scanner -t upload   # I2C bring-up
;   pio run -e oled_hello -t upload    # SSD1306 message smoke test
;   pio run -e sensor_display -t upload  # live HR/IMU/BAT HUD

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_src_filter = +<main.cpp>
lib_deps =
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
; Board defaults: USB CDC on boot for Serial over COM4.

[env:i2c_scanner]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_src_filter = +<i2c_scanner.cpp>
; Board defaults already set ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1.

[env:oled_hello]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_src_filter = +<oled_hello.cpp>
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11

[env:sensor_display]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_src_filter = +<sensor_display.cpp>
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
